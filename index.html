<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDI Plan &amp; Actual — All Yard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1f3864; --navy-2:#2e5c8a; --blue:#2e75b6; --blue-soft:#e4eef8;
  --orange:#ed7d31; --orange-soft:#fcebdd; --amber:#f59f00;
  --green:#2f9e44; --green-soft:#e6f4ea; --red:#c92a2a; --pink:#ffe3e3;
  --bg:#eef1f7; --card:#ffffff; --ink:#16213a; --muted:#64748b;
  --line:#dbe3ef; --line-strong:#b9c7de; --input:#fffaeb;
  --radius:14px; --shadow:0 1px 2px rgba(20,35,70,.06), 0 8px 24px rgba(20,35,70,.07);
  --mono:'Space Grotesk',ui-monospace,monospace;
}
[data-theme="dark"]{
  --navy:#0e1830; --navy-2:#1b3559; --blue:#4a9de0; --blue-soft:#16283f;
  --orange:#f0904c; --orange-soft:#3a2418; --bg:#0a1020; --card:#111a2e;
  --ink:#e6ecf7; --muted:#93a3bd; --line:#22304c; --line-strong:#33456a;
  --input:#1b2338; --green-soft:#15291c; --pink:#3a1a1e;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans Thai',system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
header.top{
  background:linear-gradient(120deg,var(--navy),var(--navy-2));
  color:#fff; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  position:sticky; top:0; z-index:30; box-shadow:0 2px 14px rgba(15,25,50,.25);
}
header.top h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px}
header.top .sub{font-size:11.5px; opacity:.72; margin-top:2px}
.spacer{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px;
  font-size:11.5px; font-weight:600; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.18);
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.chip.ok .dot{background:#5ee08a} .chip.err .dot{background:#ff8f8f}
.iconbtn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff;
  border-radius:10px; padding:7px 11px; cursor:pointer; font-size:13px; font-family:inherit;
  transition:background .18s ease, transform .18s ease;
}
.iconbtn:hover{background:rgba(255,255,255,.25); transform:translateY(-1px)}
nav.tabs{
  display:flex; gap:4px; padding:0 20px; background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:62px; z-index:25; overflow-x:auto;
}
nav.tabs button{
  background:none; border:0; border-bottom:2.5px solid transparent; color:var(--muted);
  padding:12px 14px; font-size:13.5px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit;
  transition:color .18s ease, border-color .18s ease;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--navy); border-color:var(--blue)}
[data-theme="dark"] nav.tabs button.on{color:var(--blue)}
main{padding:18px 20px 60px; max-width:1680px; margin:0 auto}
.bar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
select,input[type=text],input[type=date],input[type=number]{
  font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--card);
  border:1px solid var(--line-strong); border-radius:10px; padding:8px 11px; outline:none;
}
select:focus,input:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(46,117,182,.15)}
.btn{
  font-family:inherit; font-size:13.5px; font-weight:600; border-radius:10px; padding:9px 15px;
  border:1px solid var(--navy); background:var(--navy); color:#fff; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(31,56,100,.25)}
.btn.ghost{background:var(--card); color:var(--navy); border-color:var(--line-strong)}
[data-theme="dark"] .btn.ghost{color:var(--ink)}
.btn.warn{background:var(--red); border-color:var(--red)}
.btn.sm{padding:5px 10px; font-size:12px; border-radius:8px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px}
.card h2{margin:0 0 12px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px}
.card h2 .tag{font-size:11px; font-weight:600; color:var(--muted); background:var(--bg); padding:3px 8px; border-radius:999px}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kpi:before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--blue)}
.kpi.actual:before{background:var(--orange)} .kpi.diff:before{background:var(--red)} .kpi.pct:before{background:var(--green)}
.kpi .lbl{font-size:11.5px; color:var(--muted); font-weight:600; letter-spacing:.3px}
.kpi .val{font-family:var(--mono); font-size:27px; font-weight:700; margin-top:4px; letter-spacing:-.5px}
.kpi .foot{font-size:11.5px; color:var(--muted); margin-top:2px}
.scroll{overflow:auto; border:1px solid var(--line); border-radius:12px; background:var(--card)}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap}
thead th{background:#dce6f1; color:var(--navy); font-weight:700; font-size:12px; position:sticky; top:0; z-index:5}
[data-theme="dark"] thead th{background:#16233c; color:var(--ink)}
tbody tr:hover td{background:rgba(46,117,182,.05)}
td.l,th.l{text-align:left}
.plan-c{background:var(--blue-soft); color:#1f4e79; font-weight:600}
.act-c{background:var(--orange-soft); color:#a9500f; font-weight:600}
[data-theme="dark"] .plan-c{color:#9ecbf0} [data-theme="dark"] .act-c{color:#f0b184}
.skip-c{background:#ede7f6; color:#5e35b1; font-weight:600}
.grid-in.skip-in{background:#f1ecfa; color:#5e35b1}
[data-theme="dark"] .grid-in.skip-in{background:#2a2440; color:#c3b1f0}
[data-theme="dark"] .skip-c{background:#2a2440; color:#c3b1f0}
.tot-c{background:var(--navy); color:#fff; font-weight:700}
.neg{color:var(--red); font-weight:700} .pos{color:var(--green); font-weight:700}
.grid-in{
  width:42px; text-align:center; border:1px solid transparent; background:var(--input);
  border-radius:6px; padding:4px 2px; font-family:var(--mono); font-size:12.5px; color:inherit;
}
.grid-in:focus{border-color:var(--blue); background:var(--card)}
.grid-in.zero{color:var(--muted); opacity:.45}
.eta-cell{background:var(--input); font-weight:700}
.eta-cell.carried{background:#fce4d6; color:#c92a2a}
[data-theme="dark"] .eta-cell.carried{background:#3a2418; color:#f2a4a4}
.wknd{background:rgba(31,56,100,.045)}
[data-theme="dark"] .wknd{background:rgba(255,255,255,.035)}
.today{outline:2px solid var(--amber); outline-offset:-2px}
.model-row{display:flex; align-items:center; gap:3px}
.model-row select{flex:1; min-width:0}
.row-del{flex:none; border:none; background:transparent; cursor:pointer; font-size:12px; line-height:1;
  padding:2px 3px; border-radius:5px; opacity:.5}
.row-del:hover{opacity:1; background:rgba(201,42,42,.14)}
/* โหมดพอดีจอ: โชว์วันที่ 1-31 ครบใน 1 หน้า ไม่ต้องเลื่อนแนวนอน */
.grid-table.fit{table-layout:fixed; width:100%; min-width:0}
.grid-table.fit th,.grid-table.fit td{padding:3px 1px; font-size:10.5px; overflow:hidden}
.grid-table.fit .grid-in{width:100%; font-size:10.5px; padding:3px 0; border-radius:4px}
.grid-table.fit select[data-k="model"]{width:100%; padding:3px 2px !important; font-size:10.5px !important}
.grid-table.fit .eta-cell{font-size:10.5px}
.grid-table.fit .eta-cell .mini{font-size:9px}
.scroll.fitwrap{overflow-x:hidden}
.bar-chart{display:flex; align-items:flex-end; gap:3px; height:140px; padding:8px 0}
.bar-chart .b{flex:1; min-width:6px; background:linear-gradient(180deg,var(--orange),#f4a468); border-radius:3px 3px 0 0; position:relative; transition:filter .15s}
.bar-chart .b:hover{filter:brightness(1.12)}
.bar-chart .b.under{background:linear-gradient(180deg,#e06666,#f0a0a0)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); flex-wrap:wrap}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.note-in{width:100%; border:1px solid var(--line); background:var(--input); border-radius:8px; padding:6px 9px; font-family:inherit; font-size:13px; color:inherit}
.note-in:focus{border-color:var(--blue); outline:none}
.row-under td{background:var(--pink)!important}
.empty{padding:34px; text-align:center; color:var(--muted)}
.banner{background:#fff4d6; border:1px solid #f7d98a; color:#7a5400; padding:12px 16px; border-radius:12px; margin-bottom:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
[data-theme="dark"] .banner{background:#2d2411; border-color:#5c4a1c; color:#f0d69a}
.toast{
  position:fixed; right:18px; bottom:18px; background:var(--navy); color:#fff; padding:11px 16px;
  border-radius:12px; font-size:13px; box-shadow:0 10px 30px rgba(10,20,45,.3); z-index:90;
  transform:translateY(80px); opacity:0; transition:all .28s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show{transform:translateY(0); opacity:1}
.grp-line td{border-top:2px solid var(--line-strong)}
.grid-table{width:max-content; min-width:100%}
.grid-table th,.grid-table td{padding:5px 6px}
.hint{font-size:11.5px; color:var(--muted); margin-top:8px}
.mini{font-size:11px; color:var(--muted)}
details.help{margin-top:10px} details.help summary{cursor:pointer; font-size:12.5px; color:var(--muted); font-weight:600}
code{background:var(--bg); padding:2px 6px; border-radius:6px; font-family:var(--mono); font-size:12px}
.mchips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px}
.mchip{display:inline-flex; align-items:center; gap:5px; background:var(--blue-soft); color:var(--navy); border:1px solid var(--line-strong); border-radius:999px; padding:3px 6px 3px 11px; font-size:12.5px; font-weight:600}
[data-theme="dark"] .mchip{color:var(--ink)}
.mchip button{background:none; border:0; color:var(--muted); cursor:pointer; font-size:12px; line-height:1; padding:2px 3px; border-radius:50%}
.mchip button:hover{background:var(--red); color:#fff}
.madd{display:flex; gap:6px; align-items:center}
.madd .mnew{flex:1; min-width:150px; font-size:12.5px; padding:5px 9px}
.modal-bg{position:fixed; inset:0; background:rgba(10,18,35,.55); z-index:80; display:flex; align-items:center; justify-content:center; padding:16px}
.modal{background:var(--card); border-radius:16px; box-shadow:0 20px 60px rgba(10,20,45,.4); padding:20px; width:min(560px,100%); max-height:90vh; overflow:auto}
.modal h2{font-size:16px}
.modal textarea{width:100%; font-family:inherit; font-size:13.5px; border:1px solid var(--line-strong); border-radius:10px; padding:10px; resize:vertical; background:var(--input); color:var(--ink)}
.modal textarea:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(46,117,182,.15)}
.preview{margin-top:12px; border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--bg); font-size:13px}
.preview .row{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--line)}
.preview .row:last-child{border-bottom:0}
.preview .warn{color:var(--red); font-weight:600}
.preview .ok{color:var(--green); font-weight:700}
pre{background:var(--bg); padding:12px; border-radius:10px; overflow:auto; font-size:11.5px; border:1px solid var(--line)}
@media(max-width:700px){ header.top h1{font-size:15px} main{padding:14px 12px 50px} .kpi .val{font-size:22px} }
</style>
</head>

const SEED = JSON.parse(document.getElementById('seed').textContent);
const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

const YEAR = SEED.year;

const state = {
  view:'dash', yard:SEED.yards[0], month:9,
  config:{ dailyPlanTotal:SEED.dailyPlanTotal, yards:[...SEED.yards], months:[...SEED.months],
           models:JSON.parse(JSON.stringify(SEED.models)), yardPlan:{}, cutoff:SEED.cutoff,
           zoneCap:120,
           zones:[["Rayong yard","Soi 5"],["NYB2 Phase 2","VEHICLE 60Rai"]] },
  lots:[], notes:{}, ready:false
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const daysIn = m => new Date(YEAR, m, 0).getDate();
const isWknd = (m,d) => { const w = new Date(YEAR, m-1, d).getDay(); return w===0||w===6; };
const fmt = n => (n===0||n===undefined||n===null||isNaN(n)) ? '-' : Number(n).toLocaleString('en-US');
const fmtSigned = n => n>0 ? '+'+Number(n).toLocaleString('en-US') : (n<0 ? Number(n).toLocaleString('en-US') : '0');
const pct = (a,b) => b>0 ? (a/b*100).toFixed(1)+'%' : '–';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const etaLabel = iso => { const [y,m,d]=iso.split('-').map(Number); return `${d} ${EN_MONTH[m-1]} '${String(y).slice(2)}`; };
const sumMap = o => Object.values(o||{}).reduce((a,b)=>a+(Number(b)||0),0);

function toast(msg, ms=2200){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'), ms);
}
let saveTimer=null;
function flagSaving(){
  const c=$('#saveChip'); c.style.display='inline-flex'; c.classList.remove('ok');
  $('#saveText').textContent='กำลังบันทึก…';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ c.classList.add('ok'); $('#saveText').textContent='บันทึกแล้ว'; }, 700);
}

/* ---------- storage layer: Firebase Realtime Database, else localStorage ---------- */
const DB = { mode:'local', db:null, api:null, reason:null };
const LS_KEY = 'pdi_plan_actual_v1';
const clean = o => JSON.parse(JSON.stringify(o??null));          // ตัด undefined/ฟังก์ชันออก ให้ RTDB รับได้
const keyOK = s => String(s).replace(/[.#$/\[\]]/g,'-');          // อักขระต้องห้ามของ RTDB key

async function initDB(){
  try{
    const [appMod, rtdb] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js')
    ]);
    const app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(firebaseConfig);
    DB.db = rtdb.getDatabase(app); DB.api = rtdb; DB.mode='rtdb';
    setChip('ok','ออนไลน์ • Realtime Database');
    // อ่าน config ก่อนหนึ่งครั้ง เพื่อจับ error สิทธิ์ให้เร็ว
    await new Promise((res,rej)=>{
      const t=setTimeout(()=>rej(new Error('timeout')), 12000);
      rtdb.onValue(rtdb.ref(DB.db,'config/settings'), snap=>{
        clearTimeout(t);
        const v=snap.val(); if(v) Object.assign(state.config, v);
        res();
      }, err=>{ clearTimeout(t); rej(err); }, {onlyOnce:true});
    });
    // subscribe แบบเรียลไทม์
    rtdb.onValue(rtdb.ref(DB.db,'config/settings'), snap=>{ const v=snap.val(); if(v) Object.assign(state.config, v); if(state.ready) render(); });
    rtdb.onValue(rtdb.ref(DB.db,'lots'), snap=>{
      const v=snap.val()||{}; state.lots = Object.entries(v).map(([id,d])=>({id, ...d}));
      state.ready = true; render();
    }, e=>{ console.error(e); toast('อ่านข้อมูล lots ไม่ได้: '+(e.code||e.message)); });
    rtdb.onValue(rtdb.ref(DB.db,'notes'), snap=>{ state.notes = snap.val()||{}; if(state.ready) render(); }, e=>console.error(e));
  }catch(err){
    console.warn('Realtime Database unavailable →  localStorage', err);
    DB.mode='local'; DB.reason = diagnose(err);
    setChip('err','ออฟไลน์: '+DB.reason.short);
    loadLocal(); state.ready=true;
  }
}
function diagnose(err){
  const raw = (err && (err.code||err.message||'')).toString().toLowerCase();
  const fileProto = location.protocol==='file:';
  if(raw.includes('permission')||raw.includes('denied'))
    return {short:'Database rules ปิดอยู่', fix:'rules', detail:'Realtime Database มีอยู่แล้ว แต่กฎ (Rules) ยังปิดการอ่าน/เขียน — ต้องเปิด Rules ในหน้า Firebase Console'};
  if(fileProto)
    return {short:'เปิดจากไฟล์ในเครื่อง', fix:'host', detail:'ไฟล์ถูกเปิดแบบ file:// เบราว์เซอร์บล็อกการต่อฐานข้อมูล — ต้องเปิดผ่านลิงก์ http(s) หรือ deploy ขึ้น Firebase Hosting'};
  return {short:'เชื่อมต่อไม่ได้', fix:'net', detail:'ต่อฐานข้อมูลไม่สำเร็จ ('+raw+') — ตรวจอินเทอร์เน็ตหรือลองใหม่'};
}
function setChip(cls,text){
  const c=$('#dbChip'); c.classList.remove('ok','err'); if(cls) c.classList.add(cls);
  $('#dbText').textContent=text;
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const o=JSON.parse(raw); state.lots=o.lots||[]; state.notes=o.notes||{}; Object.assign(state.config,o.config||{}); }
  }catch(e){ console.warn(e); }
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({lots:state.lots, notes:state.notes, config:state.config})); }
  catch(e){ console.warn(e); }
}

/* write helpers — same call signature in both modes */
async function putLot(lot){
  flagSaving();
  if(DB.mode==='rtdb'){
    const {ref,set} = DB.api; const {id, ...data} = lot;
    await set(ref(DB.db,'lots/'+keyOK(id)), clean(data));
  }else{
    const i = state.lots.findIndex(l=>l.id===lot.id);
    if(i<0) state.lots.push(lot); else state.lots[i]=lot;
    saveLocal(); render();
  }
}
async function delLot(id){
  flagSaving();
  if(DB.mode==='rtdb'){ const {ref,remove}=DB.api; await remove(ref(DB.db,'lots/'+keyOK(id))); }
  else { state.lots = state.lots.filter(l=>l.id!==id); saveLocal(); render(); }
}
async function putNote(key, data){
  flagSaving();
  if(DB.mode==='rtdb'){ const {ref,update}=DB.api; await update(ref(DB.db,'notes/'+keyOK(key)), clean(data)); }
  else { state.notes[key]={...(state.notes[key]||{}), ...data}; saveLocal(); }
}
async function putConfig(patch){
  Object.assign(state.config, patch); flagSaving();
  if(DB.mode==='rtdb'){ const {ref,set}=DB.api; await set(ref(DB.db,'config/settings'), clean(state.config)); }
  else { saveLocal(); render(); }
}
async function writeLots(lots, wipe=false){
  if(DB.mode==='rtdb'){
    const {ref,set,update} = DB.api;
    if(wipe) await set(ref(DB.db,'lots'), null);
    const patch={}; lots.forEach(l=>{ const {id,...data}=l; patch[keyOK(id)]=clean(data); });
    if(Object.keys(patch).length) await update(ref(DB.db,'lots'), patch);
  }else{
    if(wipe) state.lots = lots.slice();
    else { const map=new Map(state.lots.map(l=>[l.id,l])); lots.forEach(l=>map.set(l.id,l)); state.lots=[...map.values()]; }
    saveLocal(); render();
  }
}

/* ---------- calculations ---------- */
const lotsOf = (yard,month) => state.lots.filter(l=>l.yard===yard && Number(l.month)===Number(month));

/* ===== ตารางแผน PDI แบบโซน =====
   กฎ: รถเข้าวัน X → เริ่มทำ PDI วัน X+1 · แต่ละโซนทำได้ ≤ zoneCap/วัน (นับทุกวัน)
   ในโซน ลานที่มีของค้างเยอะกว่าทำก่อน · ล้นก็ไหลไปวันถัดไป (ข้ามเดือนได้) */
const ORD = (y,m,d)=>Math.floor(Date.UTC(y,m-1,d)/86400000);
const ordMD = o=>{ const t=new Date(o*86400000); return [t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()]; };
function getZones(){
  const ys = state.config.yards, used=new Set();
  const zones = (state.config.zones||[]).map(z=>z.filter(y=>ys.includes(y))).filter(z=>z.length);
  zones.forEach(z=>z.forEach(y=>used.add(y)));
  ys.filter(y=>!used.has(y)).forEach(y=>zones.push([y]));   // ลานที่ไม่อยู่โซนใด = โซนเดี่ยว
  return zones;
}
// ===== Plan PDI: เริ่มทำวันถัดจากรถเข้า · โซนละ ≤ zoneCap/วัน · ล้นไปวันถัดไป · ลานค้างเยอะสุดทำก่อน =====
//  แยกยอดกลับไปแต่ละล็อต เพื่อให้แถว Plan PDI ของล็อตนั้นโชว์วันเริ่มทำ (รถเข้า +1 วัน)
function computeSchedule(){
  const cap = Number(state.config.zoneCap)||120;
  const sched = {}; state.config.yards.forEach(y=>sched[y]={});
  const lot = {};
  const m0=state.config.months[0], mN=state.config.months.at(-1);
  const endOrd = ORD(YEAR, mN, daysIn(mN));
  for(const zone of getZones()){
    const items = [];   // {id, y, avail, rem, idx}
    state.lots.forEach((l,idx)=>{
      if(!zone.includes(l.yard)) return;
      const q = Number(l.qty)|| sumMap(l.plan); if(!q) return;
      const [yy,mm,dd] = l.eta.split('-').map(Number);
      items.push({id:l.id, y:l.yard, avail:ORD(yy,mm,dd)+1, rem:q, idx});   // เริ่มทำวันถัดจากรถเข้า
    });
    if(!items.length) continue;
    const remY = y => items.reduce((s,it)=> it.y===y && it.avail<=CUR && it.rem>0 ? s+it.rem : s, 0);
    let CUR = Math.min(...items.map(it=>it.avail));
    const hasLeft = ()=> items.some(it=>it.rem>0);
    const arriving = oo => items.some(it=>it.avail>=oo && it.rem>0);
    for(let guard=0; guard<3000 && (CUR<=endOrd || hasLeft()); CUR++, guard++){
      const o=CUR; let capLeft = cap;
      while(capLeft>0){
        let by=null, mx=0; for(const y of zone){ const r=remY(y); if(r>mx){ mx=r; by=y; } }  // ลานค้างเยอะสุดก่อน
        if(!by) break;
        const ready = items.filter(it=>it.y===by && it.avail<=o && it.rem>0).sort((a,b)=>a.avail-b.avail||a.idx-b.idx);
        let need = Math.min(mx, capLeft);
        for(const it of ready){ if(need<=0) break;
          const take=Math.min(it.rem,need); it.rem-=take; need-=take; capLeft-=take;
          const [gy,gm,gd]=ordMD(o);
          if(gy===YEAR && gm>=m0 && gm<=mN){ const key=gm*100+gd;
            sched[by][key]=(sched[by][key]||0)+take;
            (lot[it.id]=lot[it.id]||{})[key]=(lot[it.id][key]||0)+take; }
        }
      }
      if(o>endOrd && !hasLeft() && !arriving(o+1)) break;
    }
  }
  return {sched, lot};
}
const zoneIndex = y => (state.config.zones||[]).findIndex(z=>z.includes(y));
function getSchedule(){ if(!state._sched) state._sched = computeSchedule(); return state._sched; }
const planScheduled = (yard,month,day) => (getSchedule().sched[yard]||{})[month*100+day] || 0;
const lotPlan = (lotId,month,day) => (getSchedule().lot[lotId]||{})[month*100+day] || 0;

// ===== คิวรถเข้า(ETA): จำกัดโซนละ ≤ zoneCap/วัน · ล้นไปวันถัดไป · เข้าคิวตามลำดับ ETA (มาก่อนได้ก่อน) =====
//  แยกยอดกลับไปที่แต่ละล็อต เพื่อให้แถวรถเข้า(ETA) ของล็อตนั้นโชว์การแบ่งวัน เช่น 221 → 120 + 101
function computeArrLots(filter){
  const cap = Number(state.config.zoneCap)||120;
  const sched = {};  state.config.yards.forEach(y=>sched[y]={});
  const lot = {};    // lotId -> {month*100+day: qty}
  const m0=state.config.months[0], mN=state.config.months.at(-1);
  const endOrd = ORD(YEAR, mN, daysIn(mN));
  for(const zone of getZones()){
    // รวมล็อตในโซน แล้วเรียงตามวันเข้า (ETA) → ลำดับล็อต (มาก่อนเข้าคิวก่อน)
    const items = [];   // {id, y, avail, rem, idx}
    state.lots.forEach((l,idx)=>{
      if(!zone.includes(l.yard) || (filter && !filter(l))) return;
      const q = Number(l.qty)|| sumMap(l.plan); if(!q) return;
      const [yy,mm,dd] = l.eta.split('-').map(Number);
      items.push({id:l.id, y:l.yard, avail:ORD(yy,mm,dd), rem:q, idx});
    });
    if(!items.length) continue;
    items.sort((a,b)=> a.avail-b.avail || a.idx-b.idx);   // มาก่อน(ETA)เข้าคิวก่อน · เสมอกันใช้ลำดับที่สร้าง
    let o = Math.min(...items.map(it=>it.avail));
    const hasLeft = ()=> items.some(it=>it.rem>0);
    const arriving = oo => items.some(it=>it.avail>=oo && it.rem>0);
    for(let guard=0; guard<3000 && (o<=endOrd || hasLeft()); o++, guard++){
      let capLeft = cap;
      for(const it of items){                     // เข้าคิวตามลำดับ
        if(capLeft<=0) break;
        if(it.avail>o || it.rem<=0) continue;
        const take = Math.min(it.rem, capLeft); it.rem-=take; capLeft-=take;
        const [gy,gm,gd]=ordMD(o);
        if(gy===YEAR && gm>=m0 && gm<=mN){
          const key=gm*100+gd;
          sched[it.y][key]=(sched[it.y][key]||0)+take;
          (lot[it.id]=lot[it.id]||{})[key]=(lot[it.id][key]||0)+take;
        }
      }
      if(o>endOrd && !hasLeft() && !arriving(o+1)) break;
    }
  }
  return {sched, lot};
}
function arrRoll(){    if(!state._arr)    state._arr    = computeArrLots(null);          return state._arr; }
function arrRollNew(){ if(!state._arrN)   state._arrN   = computeArrLots(l=>!l.carried); return state._arrN; }
const arrCapped    = (yard,month,day) => (arrRoll().sched[yard]||{})[month*100+day] || 0;
const arrCappedNew = (yard,month,day) => (arrRollNew().sched[yard]||{})[month*100+day] || 0;
const lotArr       = (lotId,month,day) => (arrRoll().lot[lotId]||{})[month*100+day] || 0;
// แผนเฉลี่ย/วัน ของลาน (ไว้โชว์เป็นข้อมูล) = zoneCap ÷ จำนวนลานในโซน
const planPerDay = yard => {
  const z = getZones().find(zz=>zz.includes(yard)) || [yard];
  return (Number(state.config.zoneCap)||120) / z.length;
};

function dayAgg(yard, month){
  // arrivals/arrivalsNew = คิวรถเข้าแบบจำกัด ≤ zoneCap/วัน (ล้นไปวันถัดไป) · actual = กรอกจริง
  const n=daysIn(month), arrivals=Array(n+1).fill(0), arrivalsNew=Array(n+1).fill(0), actual=Array(n+1).fill(0), skip=Array(n+1).fill(0);
  for(let d=1; d<=n; d++){ arrivals[d]=arrCapped(yard,month,d); arrivalsNew[d]=arrCappedNew(yard,month,d); }
  lotsOf(yard,month).forEach(l=>{
    // actual (สรุป) = PDI ปกติ + Skip · l.actual = PDI ปกติ, l.skip = Skip
    for(const [d,v] of Object.entries(l.actual||{})) if(+d<=n) actual[+d]+=Number(v)||0;
    for(const [d,v] of Object.entries(l.skip||{}))   if(+d<=n){ skip[+d]+=Number(v)||0; actual[+d]+=Number(v)||0; }
  });
  const plan = Array(n+1).fill(0); for(let d=1;d<=n;d++) plan[d]=planScheduled(yard,month,d);
  return {n, arrivals, arrivalsNew, actual, skip, plan};
}
function allYardAgg(month){
  const n=daysIn(month), keys=['arrivals','arrivalsNew','actual','skip','plan'];
  const o={n}; keys.forEach(k=>o[k]=Array(n+1).fill(0));
  state.config.yards.forEach(y=>{
    const a=dayAgg(y,month);
    for(let d=1; d<=n; d++) keys.forEach(k=>o[k][d]+=a[k][d]);
  });
  return o;
}
const monthTotals = (yard,month) => {
  const a = dayAgg(yard,month);
  const s = arr => arr.reduce((x,y)=>x+y,0);
  return {plan:s(a.plan), actual:s(a.actual), skip:s(a.skip), arrivals:s(a.arrivalsNew), due:s(a.arrivals)};
};

/* ---------- views ---------- */
function render(){
  if(!state.ready) return;
  state._sched = state._arr = state._arrN = null;   // คำนวณตาราง/คิวรถเข้าใหม่ทุกครั้งที่ข้อมูลเปลี่ยน
  const v=state.view;
  $('#subTitle').textContent =
    `${state.config.yards.length} Yard · ${getZones().length} โซน · ${EN_MONTH[state.config.months[0]-1]}–${EN_MONTH[state.config.months.at(-1)-1]} ${YEAR} · แผน ${fmt(state.config.zoneCap)} คัน/วัน/โซน`;
  const el=$('#app');
  el.innerHTML = connectBanner() + (
    v==='dash' ? viewDash() :
    v==='entry' ? viewEntry() :
    v==='daily' ? viewDaily() :
    v==='monthly' ? viewMonthly() :
    v==='issues' ? viewIssues() : viewSettings());
  wire();
}

    `<option value="${m}" ${m==state.month?'selected':''}>${TH_MONTH[m-1]} / ${EN_MONTH[m-1]} ${YEAR}</option>`).join('')}</select>`;
}
function yardPicker(id='yardSel'){
  return `<select id="${id}">${state.config.yards.map(y=>
    `<option value="${esc(y)}" ${y===state.yard?'selected':''}>${esc(y)}</option>`).join('')}</select>`;
}
function seedBanner(){
  if(state.lots.length) return '';
  return `<div class="banner">ยังไม่มีข้อมูลในฐานข้อมูล — กดนำเข้าข้อมูลตั้งต้นจาก Defect list (ตัดยอด ${esc(state.config.cutoff)}) ได้เลย
    <button class="btn sm" id="seedNow">นำเข้าข้อมูลตั้งต้น</button></div>`;
}

      <button class="btn sm" id="reconnectBtn">↻ ลองเชื่อมต่อใหม่</button>

/* ---- 1. dashboard ---- */
function viewDash(){
  const months=state.config.months;
  let P=0,A=0,ARR=0;
  months.forEach(m=>state.config.yards.forEach(y=>{
    const t=monthTotals(y,m); P+=t.plan; A+=t.actual; ARR+=t.arrivals;
  }));
  // ยอดจริงที่ต้องทำ PDI ทั้งหมด = จำนวนรถจากไฟล์ (ผลรวม qty ทุกล็อต) ไม่ใช่แผน 120/วัน
  const DUE = state.lots.reduce((s,l)=>s+(Number(l.qty)||sumMap(l.plan)),0);
  const a=allYardAgg(state.month), n=a.n;
  const maxV=Math.max(...a.actual.slice(1), ...a.plan.slice(1), 1);
  const bars=Array.from({length:n},(_,i)=>{
    const d=i+1, act=a.actual[d], pl=a.plan[d];
    return `<div class="b ${act<pl?'under':''}" style="height:${Math.max(2,act/maxV*100)}%" title="วันที่ ${d} · ทำได้ ${fmt(act)} / แผน ${fmt(Math.round(pl))} คัน"></div>`;
  }).join('');
  const planLine = (a.plan[1]/maxV*100);

  const rows = months.map(m=>{
    let p=0,ac=0,ar=0;
    state.config.yards.forEach(y=>{const t=monthTotals(y,m); p+=t.plan; ac+=t.actual; ar+=t.arrivals;});
    return `<tr><td class="l"><b>${EN_MONTH[m-1]}</b> <span class="mini">${TH_MONTH[m-1]}</span></td>
      <td class="plan-c num">${fmt(Math.round(p))}</td><td class="act-c num">${fmt(ac)}</td>
      <td class="num ${ac-p<0?'neg':'pos'}">${fmtSigned(Math.round(ac-p))}</td>
      <td class="num">${pct(ac,p)}</td><td class="num">${fmt(ar)}</td></tr>`;
  }).join('');
  const yardRows = state.config.yards.map(y=>{
    let p=0,ac=0,ar=0;
    months.forEach(m=>{const t=monthTotals(y,m); p+=t.plan; ac+=t.actual; ar+=t.arrivals;});
    const openN = openUnits(y);
    return `<tr><td class="l"><b>${esc(y)}</b></td><td class="plan-c num">${fmt(Math.round(p))}</td>
      <td class="act-c num">${fmt(ac)}</td><td class="num ${ac-p<0?'neg':'pos'}">${fmtSigned(Math.round(ac-p))}</td>
      <td class="num">${pct(ac,p)}</td><td class="num">${fmt(ar)}</td><td class="num ${openN>0?'neg':''}">${fmt(openN)}</td></tr>`;
  }).join('');

  return `${seedBanner()}
  <div class="kpis">
    <div class="kpi"><div class="lbl">รถต้องทำ PDI ทั้งหมด (${EN_MONTH[months[0]-1]}–${EN_MONTH[months.at(-1)-1]})</div>
      <div class="val num">${fmt(DUE)}</div><div class="foot">ยอดจริงจากไฟล์ (ทุกล็อต)</div></div>
    <div class="kpi actual"><div class="lbl">ACTUAL PDI</div><div class="val num">${fmt(A)}</div>
      <div class="foot">ทำได้จริงสะสม (รวม Skip)</div></div>
    <div class="kpi diff"><div class="lbl">คงเหลือ</div><div class="val num ${A-DUE<0?'neg':'pos'}">${fmtSigned(Math.round(A-DUE))}</div>
      <div class="foot">ทำแล้ว − ต้องทำ</div></div>
    <div class="kpi pct"><div class="lbl">% ความสำเร็จ</div><div class="val num">${pct(A,DUE)}</div>
      <div class="foot">รถเข้าทั้งหมด ${fmt(ARR)} คัน</div></div>
  </div>

  <div class="card">
    <h2>ทำได้จริงรายวัน <span class="tag">${TH_MONTH[state.month-1]} ${YEAR}</span>
      <span class="spacer"></span>${monthPicker()}</h2>
    <div style="position:relative">
      <div class="bar-chart">${bars}</div>
      <div style="position:absolute; left:0; right:0; bottom:${8+planLine*1.24}px; border-top:2px dashed var(--blue); pointer-events:none"></div>
    </div>
    <div class="legend"><span><i style="background:var(--orange)"></i>ทำได้ตามแผน</span>
      <span><i style="background:#e06666"></i>ต่ำกว่าแผน</span>
      <span><i style="background:var(--blue)"></i>เส้นแผน ${fmt(Math.round(a.plan[1]))} คัน/วัน</span></div>
  </div>

  <div class="card"><h2>สรุปรายเดือน รวมทุก Yard</h2>
    <div class="scroll"><table><thead><tr><th class="l">เดือน</th><th>Plan PDI</th><th>Actual PDI</th><th>Diff.</th><th>% สำเร็จ</th><th>รถเข้า (ETA)</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>

  <div class="card"><h2>แยกราย Yard</h2>
    <div class="scroll"><table><thead><tr><th class="l">Yard</th><th>Plan PDI</th><th>Actual PDI</th><th>Diff.</th><th>% สำเร็จ</th><th>รถเข้า (ETA)</th><th>ค้าง PDI</th></tr></thead>
    <tbody>${yardRows}</tbody></table></div>
    <div class="hint">ค้าง PDI = รถเข้าสะสม − ทำ PDI สะสม ของ yard นั้น (ทุกเดือนรวมกัน)</div></div>`;
}
function openUnits(yard){
  let arr=0, act=0;
  state.config.months.forEach(m=>{ const t=monthTotals(yard,m); arr+=t.arrivals; act+=t.actual; });
  return Math.max(0, arr-act);
}

/* ---- 2. entry grid ---- */
function viewEntry(){
  const m=state.month, n=daysIn(m), yard=state.yard;
  const list = lotsOf(yard,m);
  const groups = {};
  list.forEach(l=>{ const k=(l.carried?'C|':'N|')+l.eta; (groups[k] = groups[k]||[]).push(l); });
  const keys = Object.keys(groups).sort((a,b)=>{
    const [ca,ea]=a.split('|'), [cb,eb]=b.split('|');
    if(ca!==cb) return ca==='C'?-1:1;
    return ea.localeCompare(eb);
  });
  const models = state.config.models[yard] || [];
  const dayHead = Array.from({length:n},(_,i)=>`<th class="${isWknd(m,i+1)?'wknd':''}">${i+1}</th>`).join('');

  let body='';
  if(!keys.length){
    body = `<tr><td colspan="${n+5}" class="empty">ยังไม่มีล็อตในเดือนนี้ — กด “+ เพิ่มล็อต ETA” เพื่อเริ่มกรอก</td></tr>`;
  }
  keys.forEach(k=>{
    const rows = groups[k].sort((a,b)=>(a.model||'').localeCompare(b.model||''));
    const carried = k.startsWith('C|'), eta = k.slice(2);
    const units = rows.reduce((s,l)=>s+(Number(l.qty)||0),0);
    const remark = rows.map(l=>l.remark).find(Boolean);
    rows.forEach((l,i)=>{
      const planCells = Array.from({length:n},(_,j)=>{
        const d=j+1, v=lotPlan(l.id,m,d);   // วันเริ่มทำ PDI = รถเข้า +1 วัน (แบ่ง ≤120/วัน/โซน)
        return `<td class="plan-c num ${isWknd(m,d)?'wknd':''}" style="color:#1f4e79">${v?fmt(v):'<span class="zero">·</span>'}</td>`;
      }).join('');
      const actCells = Array.from({length:n},(_,j)=>{
        const d=j+1, v=l.actual?.[d]||'';
        return `<td class="${isWknd(m,d)?'wknd':''}"><input class="grid-in ${v?'':'zero'}" data-id="${l.id}" data-k="actual" data-d="${d}" value="${v}" inputmode="numeric"></td>`;
      }).join('');
      const skipCells = Array.from({length:n},(_,j)=>{
        const d=j+1, v=l.skip?.[d]||'';
        return `<td class="${isWknd(m,d)?'wknd':''}"><input class="grid-in skip-in ${v?'':'zero'}" data-id="${l.id}" data-k="skip" data-d="${d}" value="${v}" inputmode="numeric"></td>`;
      }).join('');
      const first = i===0;
      body += `<tr class="${first?'grp-line':''}">
        ${first?`<td class="eta-cell ${carried?'carried':''} l" rowspan="${rows.length*3}">
            <div><b>${carried?'ยกมา ':''}${etaLabel(eta)}</b></div>
            <div class="mini num">${fmt(units)} units</div>
            ${remark?`<div class="mini" style="white-space:normal;color:var(--muted);margin-top:3px" title="${esc(remark)}">📋 ${esc(remark)}</div>`:''}
            <button class="btn sm ghost" data-add-model="${esc(k)}" style="margin-top:6px">+ รุ่น</button></td>`:''}
        <td class="l" rowspan="3">
          <div class="model-row">
            <select data-id="${l.id}" data-k="model">
              ${models.map(md=>`<option ${md===l.model?'selected':''}>${esc(md)}</option>`).join('')}
              ${models.includes(l.model)?'':`<option selected>${esc(l.model||'')}</option>`}
            </select>
            <button class="row-del" data-del="${l.id}" title="ลบแถวนี้">✏️</button>
          </div>
          <div class="mini">(PDI as normal)</div></td>
        <td rowspan="3"><input class="grid-in" data-id="${l.id}" data-k="qty" value="${l.qty||''}" inputmode="numeric"></td>
        <td class="plan-c" style="font-size:11px">Plan PDI</td>
        ${planCells}
        <td class="tot-c num">${fmt(Number(l.qty)||sumMap(l.plan))}</td>
      </tr>
      <tr>
        <td class="act-c" style="font-size:11.5px">Actual PDI</td>
        ${actCells}
        <td class="tot-c num">${fmt(sumMap(l.actual))}</td>
      </tr>
      <tr>
        <td class="skip-c" style="font-size:11.5px">Skip PDI</td>
        ${skipCells}
        <td class="tot-c num">${fmt(sumMap(l.skip))}</td>
      </tr>`;
    });
  });

  const a=dayAgg(yard,m);
  const totRow = (label, arr, cls) => `<tr><td class="l ${cls}" colspan="4"><b>${label}</b></td>
    ${Array.from({length:n},(_,i)=>`<td class="${cls} num ${isWknd(m,i+1)?'wknd':''}">${fmt(Math.round(arr[i+1]))}</td>`).join('')}
    <td class="tot-c num">${fmt(Math.round(arr.slice(1).reduce((x,y)=>x+y,0)))}</td></tr>`;
  const diff = Array(n+1).fill(0).map((_,d)=> d===0?0:a.actual[d]-a.plan[d]);
  const diffRow = `<tr><td class="l" colspan="4" style="background:#fff2cc"><b>Diff.</b></td>
    ${Array.from({length:n},(_,i)=>{const v=Math.round(diff[i+1]);
      return `<td class="num ${v<0?'neg':'pos'} ${isWknd(m,i+1)?'wknd':''}" style="background:#fff2cc">${fmtSigned(v)}</td>`;}).join('')}
    <td class="tot-c num">${fmtSigned(Math.round(diff.slice(1).reduce((x,y)=>x+y,0)))}</td></tr>`;

  return `${seedBanner()}
  <div class="bar">
    ${yardPicker()} ${monthPicker()}
    <button class="btn" id="pasteLot">📋 วางแผนรถเข้า → สร้างล็อต</button>
    <button class="btn ghost" id="addLot">+ ล็อตว่าง</button>
    <span class="spacer"></span>
    <span class="mini">โซน: <b>${esc((getZones().find(z=>z.includes(yard))||[yard]).join(' + '))}</b> = ${fmt(state.config.zoneCap)} คัน/วัน</span>
  </div>
  <div class="card" style="padding:10px">
    <div class="scroll fitwrap" style="max-height:72vh">
      <table class="grid-table fit">
      <colgroup><col style="width:110px"><col style="width:92px"><col style="width:28px"><col style="width:82px">${Array.from({length:n},()=>'<col>').join('')}<col style="width:40px"></colgroup>
      <thead><tr>
        <th class="l">ETA</th><th class="l">Model</th><th>Q'ty</th><th>Plan&amp;Actual</th>${dayHead}<th>รวม</th>
      </tr></thead>
      <tbody>${body}
        ${totRow('รถเข้า (ETA)', a.arrivals, '')}
        ${totRow('Plan PDI (ตารางทำ)', a.plan, 'plan-c')}
        ${totRow('Actual PDI', a.actual.map((v,i)=>v-a.skip[i]), 'act-c')}
        ${totRow('Skip PDI', a.skip, 'skip-c')}
        ${diffRow}
      </tbody></table>
    </div>
    <div class="hint"><b>Actual PDI</b> = PDI ปกติ (สีครีม) / <b>Skip PDI</b> = Skip (สีม่วง) กรอกแยกกัน · ทำจริงทั้งหมด = Actual + Skip · <b>Plan PDI คำนวณอัตโนมัติ</b> — รถเข้าวันไหน เริ่มทำวันถัดไป กระจายวันละ ${fmt(state.config.zoneCap)} คัน/โซน · ${esc((getZones().find(z=>z.includes(yard))||[yard]).join(' + '))} = ${fmt(state.config.zoneCap)} คัน/วัน · Diff = Actual − Plan</div>
  </div>

  <div class="modal-bg" id="pasteModal" style="display:none">
    <div class="modal">
      <h2 style="margin:0 0 4px">📋 วางแผนรถเข้า แล้วสร้างล็อตอัตโนมัติ</h2>
      <div class="mini" style="margin-bottom:10px">วางข้อความแผนรถเข้าที่ได้รับมา ระบบจะอ่านวันที่ ETA และรุ่น/จำนวน แล้วสร้างล็อตให้เอง</div>
      <textarea id="pasteText" rows="8" placeholder="ตัวอย่าง:
แผนรถเข้าจาก BYD Factory to Rayong Yard
วันที่ 26 Sep 2026 จำนวน 77 คัน / 11 เที่ยว
(Type D)
&gt; ATTO 3 = 48 คัน
&gt; SEALION 5 = 29 คัน"></textarea>
      <div id="pastePreview" class="preview" style="display:none"></div>
      <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end">
        <button class="btn ghost" id="pasteCancel">ยกเลิก</button>
        <button class="btn" id="pasteCreate">สร้างล็อต</button>
      </div>
    </div>
  </div>`;
}

/* ---- 3. daily summary (all yards) ---- */
function viewDaily(){
  const m=state.month, n=daysIn(m), a=allYardAgg(m);
  const head=Array.from({length:n},(_,i)=>`<th class="${isWknd(m,i+1)?'wknd':''}">${i+1}</th>`).join('');
  const row=(label,arr,cls,signed=false)=>`<tr><td class="l ${cls}"><b>${label}</b></td>
    ${Array.from({length:n},(_,i)=>{const v=Math.round(arr[i+1]);
      return `<td class="num ${cls} ${isWknd(m,i+1)?'wknd':''} ${signed?(v<0?'neg':'pos'):''}">${signed?fmtSigned(v):fmt(v)}</td>`;}).join('')}
    <td class="tot-c num">${signed?fmtSigned(Math.round(arr.slice(1).reduce((x,y)=>x+y,0))):fmt(Math.round(arr.slice(1).reduce((x,y)=>x+y,0)))}</td></tr>`;
  const diff=Array(n+1).fill(0).map((_,d)=>d===0?0:a.actual[d]-a.plan[d]);
  const pctRow=`<tr><td class="l"><b>% ความสำเร็จ</b></td>
    ${Array.from({length:n},(_,i)=>`<td class="num ${isWknd(m,i+1)?'wknd':''}">${a.plan[i+1]?pct(a.actual[i+1],a.plan[i+1]):'–'}</td>`).join('')}
    <td class="tot-c num">${pct(a.actual.slice(1).reduce((x,y)=>x+y,0), a.plan.slice(1).reduce((x,y)=>x+y,0))}</td></tr>`;

  const dayCells = (fn,cls,signed=false)=>Array.from({length:n},(_,i)=>{const v=Math.round(fn(i+1));
    return `<td class="num ${cls} ${isWknd(m,i+1)?'wknd':''} ${signed?(v<0?'neg':'pos'):''}">${signed?fmtSigned(v):fmt(v)}</td>`;}).join('');
  const rowTot = (fn,signed=false)=>{const t=Math.round(Array.from({length:n},(_,i)=>fn(i+1)).reduce((x,y)=>x+y,0)); return signed?fmtSigned(t):fmt(t);};
  const banner = txt => `<tr><td class="l" colspan="${n+2}" style="background:var(--navy);color:#fff;font-weight:700;padding:6px 10px">${txt}</td></tr>`;

  // ตารางเดียว: แต่ละโซน → Plan PDI · ลานย่อย(Actual) · Actual PDI  แล้วปิดท้ายด้วยรวมทุก Yard
  const zoneBlocks = getZones().map((zone,zi)=>{
    const yas = zone.map(y=>dayAgg(y,m));
    const zPlan = d => zone.reduce((s,y)=>s+planScheduled(y,m,d),0);
    const zAct  = d => yas.reduce((s,ya)=>s+ya.actual[d],0);
    const zSkip = d => yas.reduce((s,ya)=>s+ya.skip[d],0);
    const planRow = `<tr><td class="l plan-c"><b>Plan PDI</b></td>${dayCells(zPlan,'plan-c')}<td class="tot-c num">${rowTot(zPlan)}</td></tr>`;
    const yardRows = zone.map((y,k)=>{ const ya=yas[k];
      const norm = d => ya.actual[d]-ya.skip[d];   // PDI ปกติ (ไม่รวม Skip)
      return `<tr><td class="l" style="padding-left:18px;color:var(--muted)">${esc(y)} <span class="mini">(PDI)</span></td>
        ${Array.from({length:n},(_,i)=>`<td class="num ${isWknd(m,i+1)?'wknd':''}">${fmt(norm(i+1))}</td>`).join('')}
        <td class="tot-c num">${fmt(Array.from({length:n},(_,i)=>norm(i+1)).reduce((x,z)=>x+z,0))}</td></tr>`;
    }).join('');
    const actRow  = `<tr><td class="l act-c"><b>Actual PDI</b> <span class="mini" style="font-weight:400">(รวม Skip)</span></td>${dayCells(zAct,'act-c')}<td class="tot-c num">${rowTot(zAct)}</td></tr>`;
    const skipRow = `<tr><td class="l skip-c"><b>Skip PDI</b></td>${dayCells(zSkip,'skip-c')}<td class="tot-c num">${rowTot(zSkip)}</td></tr>`;
    return banner(`โซน ${zi+1}: ${zone.map(esc).join(' + ')}`) + planRow + yardRows + skipRow + actRow;
  }).join('');

  const dcol = `<colgroup><col style="width:172px">${Array.from({length:n},()=>'<col>').join('')}<col style="width:64px"></colgroup>`;
  return `<div class="bar">${monthPicker()}<button class="btn ghost" id="expCsv">ดาวน์โหลด CSV</button></div>
  <div class="card"><h2>Actual PDI แยกราย Yard (ตามโซน) <span class="tag">${TH_MONTH[m-1]} ${YEAR}</span></h2>
    <div class="scroll fitwrap"><table class="grid-table fit">${dcol}<thead><tr><th class="l">Zone / Yard</th>${head}<th>รวม</th></tr></thead>
    <tbody>${zoneBlocks}
      ${banner('รวมทุก Yard')}
      ${row('Plan PDI',a.plan,'plan-c')}${row('Skip PDI',a.skip,'skip-c')}${row('Actual PDI (รวม Skip)',a.actual,'act-c')}${row('Diff.',diff,'',true)}${pctRow}${row('รถเข้า (ETA)',a.arrivalsNew,'')}${row('งานที่ต้องทำ (รวมยกมา)',a.arrivals,'')}
    </tbody></table></div></div>`;
}

/* ---- 4. monthly by yard ---- */
function viewMonthly(){
  const yards=state.config.yards, months=state.config.months;
  const head = yards.map(y=>`<th colspan="4">${esc(y)}</th>`).join('')+'<th colspan="4">รวมทุก Yard</th><th>% สำเร็จ</th>';
  const sub = yards.concat(['รวม']).map(()=>`<th class="plan-c">Plan</th><th class="skip-c">Skip</th><th class="act-c">Actual</th><th>Diff.</th>`).join('')+'<th></th>';
  const rows = months.map(m=>{
    let tp=0,ta=0,tk=0;
    const cells = yards.map(y=>{
      const t=monthTotals(y,m); tp+=t.plan; ta+=t.actual; tk+=t.skip;
      return `<td class="plan-c num">${fmt(Math.round(t.plan))}</td><td class="skip-c num">${fmt(t.skip)}</td><td class="act-c num">${fmt(t.actual)}</td>
        <td class="num ${t.actual-t.plan<0?'neg':'pos'}">${fmtSigned(Math.round(t.actual-t.plan))}</td>`;
    }).join('');
    return `<tr><td class="l"><b>${TH_MONTH[m-1]}</b> <span class="mini">${EN_MONTH[m-1]}</span></td>${cells}
      <td class="plan-c num"><b>${fmt(Math.round(tp))}</b></td><td class="skip-c num"><b>${fmt(tk)}</b></td><td class="act-c num"><b>${fmt(ta)}</b></td>
      <td class="num ${ta-tp<0?'neg':'pos'}"><b>${fmtSigned(Math.round(ta-tp))}</b></td><td class="num">${pct(ta,tp)}</td></tr>`;
  }).join('');
  let gp=0,ga=0,gk=0; const gcells = yards.map(y=>{
    let p=0,a=0,k=0; months.forEach(m=>{const t=monthTotals(y,m); p+=t.plan; a+=t.actual; k+=t.skip;});
    gp+=p; ga+=a; gk+=k;
    return `<td class="tot-c num">${fmt(Math.round(p))}</td><td class="tot-c num">${fmt(k)}</td><td class="tot-c num">${fmt(a)}</td><td class="tot-c num">${fmtSigned(Math.round(a-p))}</td>`;
  }).join('');
  return `<div class="card"><h2>สรุป PDI รายเดือน แยก Yard <span class="mini" style="font-weight:400">· Actual รวม Skip แล้ว</span></h2>
    <div class="scroll"><table><thead><tr><th class="l" rowspan="2">เดือน</th>${head}</tr><tr>${sub}</tr></thead>
    <tbody>${rows}<tr><td class="tot-c l"><b>รวม</b></td>${gcells}
      <td class="tot-c num">${fmt(Math.round(gp))}</td><td class="tot-c num">${fmt(gk)}</td><td class="tot-c num">${fmt(ga)}</td>
      <td class="tot-c num">${fmtSigned(Math.round(ga-gp))}</td><td class="tot-c num">${pct(ga,gp)}</td></tr></tbody></table></div></div>`;
}

/* ---- 5. issue log ---- */
function viewIssues(){
  const m=state.month, n=daysIn(m), yards=state.config.yards;
  let rows='';
  yards.forEach(y=>{
    const a=dayAgg(y,m);
    for(let d=1; d<=n; d++){
      const plan=a.plan[d], act=a.actual[d], diff=act-plan;
      if(plan===0 && act===0 && a.arrivals[d]===0) continue;
      const key=`${y}__${m}__${d}`, note=state.notes[key]||{};
      rows += `<tr class="${diff<0?'row-under':''}">
        <td class="l">${esc(y)}</td><td class="num">${d} ${EN_MONTH[m-1]}</td>
        <td class="plan-c num">${fmt(Math.round(plan))}</td><td class="act-c num">${fmt(act)}</td>
        <td class="num ${diff<0?'neg':'pos'}">${fmtSigned(Math.round(diff))}</td>
        <td class="l">${diff<0?`<b class="neg">ต่ำกว่าเป้า ${fmt(Math.round(-diff))} คัน</b>`:'<span class="pos">ตามเป้า</span>'}</td>
        <td style="min-width:320px"><input class="note-in" data-note="${esc(key)}" data-f="text" value="${esc(note.text||'')}" placeholder="สาเหตุที่ไม่ได้ตามเป้า…"></td>
        <td style="min-width:120px"><input class="note-in" data-note="${esc(key)}" data-f="by" value="${esc(note.by||'')}" placeholder="ผู้บันทึก"></td></tr>`;
    }
  });
  if(!rows) rows=`<tr><td colspan="8" class="empty">ยังไม่มีวันที่มีข้อมูลในเดือนนี้</td></tr>`;
  return `<div class="bar">${monthPicker()}<span class="mini">แถวสีชมพู = วันที่ทำได้ต่ำกว่าแผน</span></div>
  <div class="card"><h2>บันทึกปัญหารายวัน <span class="tag">${TH_MONTH[m-1]} ${YEAR}</span></h2>
    <div class="scroll" style="max-height:74vh"><table><thead><tr><th class="l">Yard</th><th>วันที่</th><th>Plan</th><th>Actual</th><th>Diff.</th>
      <th class="l">สถานะ</th><th class="l">ปัญหา / สาเหตุ</th><th class="l">ผู้บันทึก</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ลองเชื่อมต่อ Realtime Database ใหม่ และดันข้อมูลในเครื่องขึ้นถ้าคลาวด์ว่าง */
let reconnecting=false;
async function reconnect(){
  if(reconnecting) return; reconnecting=true;
  toast('กำลังลองเชื่อมต่อ Realtime Database…', 3000);
  const localLots=state.lots.slice(), localNotes={...state.notes}, localCfg={...state.config};
  DB.mode='local'; DB.db=null; DB.api=null; state.ready=false;
  await initDB();
  reconnecting=false;
  if(DB.mode!=='rtdb'){ setChip('err','ออฟไลน์: '+(DB.reason?DB.reason.short:'')); render(); toast('ยังเชื่อมต่อไม่ได้ — '+(DB.reason?DB.reason.short:'')); return; }
  // เชื่อมต่อได้: ถ้าคลาวด์ยังว่างแต่มีข้อมูลในเครื่อง ให้ดันขึ้น
  await new Promise(r=>setTimeout(r,600));
  if(state.lots.length===0 && localLots.length){
    if(confirm(`เชื่อมต่อออนไลน์สำเร็จ! พบข้อมูล ${localLots.length} ล็อตที่กรอกไว้ในเครื่องนี้\nต้องการอัปโหลดขึ้นฐานข้อมูลออนไลน์หรือไม่?`)){
      await putConfig(localCfg);
      await writeLots(localLots, false);
      for(const [k,v] of Object.entries(localNotes)) await putNote(k,v);
      toast('อัปโหลดข้อมูลขึ้นออนไลน์แล้ว');
    }
  } else toast('เชื่อมต่อออนไลน์สำเร็จ');
  render();
}

function wire(){
  const rc=$('#reconnectBtn'); if(rc) rc.onclick=reconnect;
  const ms=$('#monthSel'); if(ms) ms.onchange=e=>{ state.month=+e.target.value; render(); };
  const ys=$('#yardSel'); if(ys) ys.onchange=e=>{ state.yard=e.target.value; render(); };

      const {id,k,d} = e.target.dataset;

async function addLot(lot){
  const id = `${lot.yard}__${lot.month}__${lot.eta}__${lot.model||'new'}__${Math.random().toString(36).slice(2,7)}`
             .replace(/\//g,'-');

/* ---------- แยกข้อความแผนรถเข้า → โครงล็อต ---------- */
const MON_EN = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const MON_TH = {'ม.ค':1,'มกรา':1,'ก.พ':2,'กุมภา':2,'มี.ค':3,'มีนา':3,'เม.ย':4,'เมษา':4,'พ.ค':5,'พฤษภา':5,
  'มิ.ย':6,'มิถุนา':6,'ก.ค':7,'กรกฎา':7,'ส.ค':8,'สิงหา':8,'ก.ย':9,'กันยา':9,'ต.ค':10,'ตุลา':10,
  'พ.ย':11,'พฤศจิกา':11,'ธ.ค':12,'ธันวา':12};
function parseDate(text){
  // 26 Sep 2026 / 26 September / 26 ก.ย. 2026 / 26 ก.ย. 69
  let m = text.match(/(\d{1,2})\s*([A-Za-z]{3,})\.?\s*(\d{2,4})?/);
  if(m){
    const mon = MON_EN[m[2].slice(0,3).toLowerCase()];
    if(mon){ let y=m[3]?+m[3]:YEAR; if(y<100) y+=2000; if(y>2400) y-=543; return {y, mo:mon, d:+m[1]}; }
  }
  m = text.match(/(\d{1,2})\s*(ม\.?ค|มกรา|ก\.?พ|กุมภา|มี\.?ค|มีนา|เม\.?ย|เมษา|พ\.?ค|พฤษภา|มิ\.?ย|มิถุนา|ก\.?ค|กรกฎา|ส\.?ค|สิงหา|ก\.?ย|กันยา|ต\.?ค|ตุลา|พ\.?ย|พฤศจิกา|ธ\.?ค|ธันวา)[ก-๙]*\.?\s*(\d{2,4})?/);
  if(m){
    let mon=null; for(const [k,v] of Object.entries(MON_TH)){ if(m[2].replace('.','').startsWith(k.replace('.',''))){ mon=v; break; } }
    if(mon){ let y=m[3]?+m[3]:YEAR+543; if(y<100) y+=2500; if(y>2400) y-=543; return {y, mo:mon, d:+m[1]}; }
  }
  // 26/09/2026 or 26-09-2026
  m = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; if(y>2400) y-=543; return {y, mo:+m[2], d:+m[1]}; }
  return null;
}
function parsePlan(text){
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const known = [...new Set(Object.values(state.config.models).flat())];
  const date = parseDate(text);
  // metadata
  let source='', trips='', type='';
  const mSrc = text.match(/จาก\s*(.+?)\s+(?:to\b|→|->|มายัง|มาที่)\s+([^\n]+?)(?:\s*วันที่|\s*จำนวน|\n|$)/i);
  if(mSrc) source = (mSrc[1].trim()+' → '+mSrc[2].trim()).replace(/\s+/g,' ');
  const mTrip = text.match(/(\d+)\s*เที่ยว/); if(mTrip) trips = mTrip[1]+' เที่ยว';
  const mType = text.match(/\(?\s*type\s*([A-Za-z0-9]+)\s*\)?/i); if(mType) type = 'Type '+mType[1].toUpperCase();
  const remark = [source, trips, type].filter(Boolean).join(' · ');
  // model lines
  const models=[]; const skip=/จำนวน|เที่ยว|total|รวม|type/i;
  for(const ln of lines){
    const mm = ln.match(/^[>\-\*•·\s]*(.+?)\s*[=:xX×]\s*(\d+)/);
    if(!mm) continue;
    let name = mm[1].replace(/^[>\-\*•·\s]+/,'').trim(), qty=+mm[2];
    if(!name || skip.test(name)) continue;
    name = name.toUpperCase().replace(/\s+/g,' ');
    // จับคู่กับรุ่นที่รู้จัก (ไม่สนช่องว่าง) เพื่อให้ตรง dropdown
    const hit = known.find(k=>k.toUpperCase().replace(/\s+/g,'')===name.replace(/\s+/g,''));
    models.push({model: hit||name, qty, newModel: !hit});
  }
  return {date, remark, source, trips, type, models};
}
async function createLotsFromPlan(parsed){
  if(!parsed.date || !parsed.models.length) return false;
  const {y,mo,d} = parsed.date;
  const iso = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  const yard = state.yard;
  // เพิ่มรุ่นใหม่เข้า config ถ้ายังไม่มีใน yard นี้
  const cur = state.config.models[yard] || [];
  const add = parsed.models.map(m=>m.model).filter(md=>!cur.includes(md));
  if(add.length){ const models={...state.config.models, [yard]:[...new Set([...cur,...add])].sort()}; await putConfig({models}); }
  // สร้างล็อต (ETA เดียว หลายรุ่น)
  const lots = parsed.models.map(m=>({
    id: `${yard}__${mo}__${iso}__${m.model}__${Math.random().toString(36).slice(2,7)}`.replace(/[\/#$\[\].]/g,'-'),
    yard, month:mo, eta:iso, carried:false, model:m.model, qty:m.qty,
    plan:{[d]:m.qty}, actual:{}, remark:parsed.remark||''
  }));
  await writeLots(lots, false);
  state.month = mo;
  setTimeout(render, 300);
  return lots.length;
}

async function doSeed(){
  const lots = SEED.lots.map((l,i)=>({
    id:`${l.yard}__${l.month}__${l.eta}__${l.model}`.replace(/[\/#\[\]]/g,'-'),
    yard:l.yard, month:l.month, eta:l.eta, carried:l.carried, model:l.model,
    qty:l.qty, plan:l.plan, actual:l.actual, skip:l.skip||{}
  }));
  await putConfig({ yards:SEED.yards, months:SEED.months, models:SEED.models,
                    dailyPlanTotal:state.config.dailyPlanTotal||SEED.dailyPlanTotal, cutoff:SEED.cutoff,
                    zoneCap:state.config.zoneCap||120, zones:state.config.zones });
  await writeLots(lots, false);
  toast(`นำเข้า ${lots.length} ล็อตแล้ว`);
  setTimeout(render, 400);
}

/* ---------- อ่านไฟล์ Co-inspection (.xlsx) ในเบราว์เซอร์ แล้วสร้างล็อต ---------- */
async function loadSheetJS(){
  if(window.XLSX) return window.XLSX;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

    document.head.appendChild(s);

const _norm = s => String(s==null?'':s).trim();
const _low  = s => _norm(s).toLowerCase();
// แปลงค่าวันที่จาก SheetJS (Date, serial number, หรือข้อความ) -> {y,m,d} หรือ null
function _cellDate(v){
  if(v==null||v==='') return null;
  if(v instanceof Date && !isNaN(v)) return {y:v.getFullYear(), m:v.getMonth()+1, d:v.getDate()};
  if(typeof v==='number'){ const o=window.XLSX.SSF.parse_date_code(v); if(o) return {y:o.y,m:o.m,d:o.d}; return null; }
  const t=new Date(v); return isNaN(t)?null:{y:t.getFullYear(), m:t.getMonth()+1, d:t.getDate()};
}
async function importCoFile(file){
  const XLSX = await loadSheetJS();
  toast('กำลังอ่านไฟล์ Co… (ไฟล์ใหญ่อาจใช้เวลาสักครู่)', 60000);
  const buf = await file.arrayBuffer();
  // อ่านเป็นเลข serial (ไม่ใช้ cellDates) แล้วแปลงวันด้วย SSF เพื่อกันวันเพี้ยนตาม timezone
  const wb = XLSX.read(buf, {type:'array', sheets:['Tracking Status'], dense:false});
  const ws = wb.Sheets['Tracking Status'];
  if(!ws) throw new Error('ไม่พบชีต "Tracking Status" ในไฟล์นี้');
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
  if(!rows.length) throw new Error('ชีต Tracking Status ว่างเปล่า');
  // หา index คอลัมน์จากหัวตาราง
  const hdr = rows[0].map(_low);
  const find = name => hdr.indexOf(name);
  const ci = {
    match: find('match tax/shuttle'), model: find('model'), pdi: find('pdi'),
    vos: find('vin of status'), final: find('final check date'), yard: find('location yard'),
  };
  const mfIdx = hdr.map((h,i)=>h.replace(/\s+/g,'').startsWith('movefrom')?i:-1).filter(i=>i>=0);
  const missing = Object.entries(ci).filter(([,v])=>v<0).map(([k])=>k);
  if(missing.length) throw new Error('ไฟล์ไม่มีคอลัมน์: '+missing.join(', '));

  const YARDS = state.config.yards, MONTHS = state.config.months;
  const cutoff = new Date();                       // ตัดยอด ณ วันนี้ (เดือนอนาคตเว้นว่าง)
  const modelFix = m => { m=_norm(m).toUpperCase(); if(m==='ATTO3')return 'ATTO 3'; if(m===''||m==='NAN')return 'ไม่ระบุรุ่น'; return m; };

  // by_lot[yard][match_iso|model] = [done{y,m,d}|null ...]
  const byYard = {}; YARDS.forEach(y=>byYard[y]={});
  const modelsOf = {}; YARDS.forEach(y=>modelsOf[y]=new Set());
  for(let r=1; r<rows.length; r++){
    const row = rows[r]; if(!row) continue;
    const yard = _norm(row[ci.yard]); if(!YARDS.includes(yard)) continue;
    if(mfIdx.some(i=>_norm(row[i]).toUpperCase().replace(/\s+/g,' ')==='MAIN YARD')) continue;
    const md = _cellDate(row[ci.match]); if(!md || md.y!==YEAR) continue;
    const model = modelFix(row[ci.model]);
    modelsOf[yard].add(model);
    if(!MONTHS.includes(md.m)) continue;
    const skip = _low(row[ci.vos])==='skip pdi';
    const done = _cellDate(skip ? row[ci.final] : row[ci.pdi]);
    const key = `${md.y}-${String(md.m).padStart(2,'0')}-${String(md.d).padStart(2,'0')}|${model}`;
    (byYard[yard][key] = byYard[yard][key] || {eta:md, model, done:[]}).done.push({d:done, skip});
  }

  const ORDv = o => o.y*10000+o.m*100+o.d;
  const lots = [];
  for(const yard of YARDS){
    const groups = Object.values(byYard[yard]);
    for(const mnum of MONTHS){
      const mStart = ORDv({y:YEAR,m:mnum,d:1});
      const allowCarry = new Date(YEAR, mnum-1, 1) <= cutoff;
      for(const g of groups){
        const iso = `${g.eta.y}-${String(g.eta.m).padStart(2,'0')}-${String(g.eta.d).padStart(2,'0')}`;
        const inMonth = {}, inSkip = {};
        g.done.forEach(x=>{ const pv=x.d; if(pv && pv.y===YEAR && pv.m===mnum){
          if(x.skip) inSkip[pv.d]=(inSkip[pv.d]||0)+1; else inMonth[pv.d]=(inMonth[pv.d]||0)+1; } });   // actual = ปกติ, skip แยก
        if(g.eta.m===mnum){
          lots.push({yard, month:mnum, eta:iso, carried:false, model:g.model,
            qty:g.done.length, plan:{[g.eta.d]:g.done.length}, actual:inMonth, skip:inSkip});
        } else if(g.eta.m<mnum && allowCarry){
          const left = g.done.filter(x=> !x.d || ORDv(x.d)>=mStart).length;
          if(left) lots.push({yard, month:mnum, eta:iso, carried:true, model:g.model,
            qty:left, plan:{1:left}, actual:inMonth, skip:inSkip});
        }
      }
    }
  }
  const models = {}; YARDS.forEach(y=> models[y] = [...modelsOf[y]].sort());
  const outLots = lots.map(l=>({
    id:`${l.yard}__${l.month}__${l.eta}__${l.model}`.replace(/[\/#\[\].$]/g,'-'),
    ...l
  }));
  const cutoffStr = `${String(cutoff.getDate()).padStart(2,'0')}/${String(cutoff.getMonth()+1).padStart(2,'0')}/${String(cutoff.getFullYear()).slice(2)}`;
  await putConfig({ yards:YARDS, months:MONTHS, models,
                    dailyPlanTotal:state.config.dailyPlanTotal||120, cutoff:cutoffStr,
                    zoneCap:state.config.zoneCap||120, zones:state.config.zones });
  await writeLots(outLots, true);   // เขียนทับทั้งหมด
  const total = outLots.reduce((s,l)=>s+l.qty,0);
  toast(`อัปเดตจากไฟล์ Co สำเร็จ · ${outLots.length} ล็อต · ${fmt(total)} คัน`, 6000);
  setTimeout(render, 400);
}

function xpaint(ws, r1,c1,r2,c2, o){
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
    const cell=ws.getCell(r,c);
    if(o.fill) cell.fill=o.fill; if(o.border) cell.border=o.border; if(o.font) cell.font=o.font;

  if(o.fill) cell.fill=o.fill; if(o.border) cell.border=o.border; if(o.font) cell.font=o.font;

/* กลุ่มล็อตของ yard/เดือน เรียงเหมือน build_linked.py: ยกมาก่อน แล้วตาม ETA, รุ่นเรียงชื่อ */
function lotGroups(yard, month){
  const list = state.lots.filter(l=>l.yard===yard && Number(l.month)===Number(month));
  const g = {};
  list.forEach(l=>{ const k=(l.carried?'C|':'N|')+l.eta; (g[k]=g[k]||[]).push(l); });
  const keys = Object.keys(g).sort((a,b)=>{
    const ca=a[0], cb=b[0]; if(ca!==cb) return ca==='C'?-1:1;
    return a.slice(2).localeCompare(b.slice(2));
  });
  return keys.map(k=>({ carried:k[0]==='C', eta:k.slice(2),
    label:(k[0]==='C'?'ยกมา ':'')+etaLabel(k.slice(2)),
    models:g[k].sort((a,b)=>(a.model||'').localeCompare(b.model||'')) }));
}

        if(rr===gd) return `=${L}${ga}-${L}${gp}`;
        if(rr===gp) return isTotal ? `=SUM(${colL(ECOL0)}${gp}:${colL(ECOLN)}${gp})` : null;
        return `=SUMIF($F$${first}:$F$${last},"Actual PDI",${L}${first}:${L}${last})`;
      };
      [[gp,'Plan PDI',XL.PLAN_H,XL.WHITE],[ga,'Actual PDI',XL.ACT_H,XL.WHITE],[gd,'Diff.',XL.T_YELL,XL.DKRED]].forEach(([rr,text,bg,fg])=>{
        xset(ws,rr,6,text,{font:XF(8,true,fg),fill:XP(bg),align:XCEN,border:BOXT});
        for(let day=1;day<=31;day++){
          const c=ECOL0+day-1;
          // Plan PDI = ตารางที่คำนวณ (ใส่เป็นตัวเลข), Actual/Diff = สูตร
          const val = day>ndays ? null : (rr===gp ? (planScheduled(yard,mnum,day)||null) : gtf(rr,colL(c),false));
          xset(ws,rr,c, val, {font:XF(9,true,fg),fill:XP(bg),align:XCEN,fmt:XL.NUMF,border:BOXT});
        }
        xset(ws,rr,ETOT,gtf(rr,TOTL,true),{font:XF(9,true,XL.WHITE),fill:XP(XL.NAVY),align:XCEN,fmt:XL.TOTF,border:BOXT});
      });
      r=gd+2;

      /* daily summary + problem log */
      ws.mergeCells(r,1,r,ETOT);
      xset(ws,r,1,'  สรุปรายวัน + บันทึกปัญหา',{font:{name:'Arial',size:10,bold:true,color:{argb:XL.WHITE}},fill:XP(XL.BAND),align:XLEFT});
      r+=1;
      const hr=r;
      [[1,1,'วันที่',XL.HDR],[2,3,'Plan',XL.PLAN_H],[4,5,'Actual',XL.ACT_H],[6,7,'Diff.',XL.HDR],[8,10,'สถานะ',XL.HDR],
       [11,27,'ปัญหา / สาเหตุที่ไม่ได้ตามเป้า',XL.T_YELL],[28,ETOT,'ผู้บันทึก',XL.T_YELL]].forEach(([c1,c2,text,bg])=>{
        const fg=(bg===XL.PLAN_H||bg===XL.ACT_H)?XL.WHITE:XL.NAVY;
        xpaint(ws,hr,c1,hr,c2,{fill:XP(bg),border:BOXH,font:XF(9,true,fg),align:XCENW});
        xset(ws,hr,c1,text); if(c2>c1) ws.mergeCells(hr,c1,hr,c2);
      });
      ws.getRow(hr).height=24; r+=1;
      const first_log=r;
      for(let day=1;day<=ndays;day++){
        const L=colL(ECOL0+day-1);
        xset(ws,r,1,day,{font:XF(9,true,XL.NAVY),fill:XP(XL.WHITE),align:XCEN,border:BOX});
        [[2,3,`=${L}${gp}`,XL.PLAN_T,XL.PLAN_C,XL.TOTF],[4,5,`=${L}${ga}`,XL.ACT_T,XL.ACT_C,XL.TOTF],
         [6,7,`=D${r}-B${r}`,XL.DKRED,XL.WHITE,XL.TOTF],
         [8,10,`=IF(B${r}=0,"-",IF(D${r}>=B${r},"ตามเป้า","ต่ำกว่าเป้า "&B${r}-D${r}&" คัน"))`,XL.NAVY,XL.WHITE,'General']].forEach(([c1,c2,f,fg,bg,fmt])=>{
          xpaint(ws,r,c1,r,c2,{fill:XP(bg),border:BOX,font:XF(9,true,fg),align:XCEN,fmt});
          xset(ws,r,c1,f); ws.mergeCells(r,c1,r,c2);
        });
        const key=`${yard}__${mnum}__${day}`, note=state.notes[key]||{};
        [[11,27,note.text||null],[28,ETOT,note.by||null]].forEach(([c1,c2,v])=>{
          xpaint(ws,r,c1,r,c2,{fill:XP(XL.INPUT),border:BOX,font:XF(9,false,XL.BLUE_IN),align:XLEFTW});
          xset(ws,r,c1,v); ws.mergeCells(r,c1,r,c2);
        });
        ws.getRow(r).height=16; r+=1;
      }
      const last_log=r-1;
      ws.addConditionalFormatting({ref:`K${first_log}:AA${last_log}`, rules:[
        {type:'expression', formulae:[`AND($F${first_log}<0,$K${first_log}="")`], style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:XL.PINK}}}}]});
      ws.addConditionalFormatting({ref:`H${first_log}:J${last_log}`, rules:[
        {type:'expression', formulae:[`$F${first_log}<0`], style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:XL.PINK}}, font:{name:'Arial',size:9,bold:true,color:{argb:XL.DKRED}}}},
        {type:'expression', formulae:[`AND($B${first_log}>0,$F${first_log}>=0)`], style:{fill:{type:'pattern',pattern:'solid',bgColor:{argb:XL.T_GREEN}}}}]});
      xset(ws,r,1,'รวมเดือน',{font:XF(9,true,XL.WHITE),fill:XP(XL.NAVY),align:XLEFT,border:BOXT});
      [[2,3,`=SUM(B${first_log}:B${last_log})`],[4,5,`=SUM(D${first_log}:D${last_log})`],[6,7,`=D${r}-B${r}`],
       [8,10,`=IF(B${r}=0,"-",TEXT(D${r}/B${r},"0.0%"))`]].forEach(([c1,c2,f])=>{
        xpaint(ws,r,c1,r,c2,{fill:XP(XL.NAVY),border:BOXT,font:XF(9,true,XL.WHITE),align:XCEN,fmt:XL.TOTF});
        xset(ws,r,c1,f); ws.mergeCells(r,c1,r,c2);
      });
      ws.getCell(r,8).numFmt='General';
      xpaint(ws,r,11,r,ETOT,{fill:XP(XL.NAVY),border:BOXT});
      GT[`${yard}|${mnum}`]=[gp,ga,gd];
      r+=3;
    }
  }

  /* ---------- 2. monthly summary by yard ---------- */
  {
    const ws=wb.getWorksheet('สรุปรายเดือน-แยก Yard'); ws.views=[{state:'frozen',xSplit:1,ySplit:5,showGridLines:false}];
    ws.getColumn(1).width=20;
    const ncol=1+(YARDS.length+1)*3+1;
    for(let i=2;i<=ncol;i++) ws.getColumn(i).width=10;
    xbanner(ws,1,ncol,'สรุป PDI รายเดือน แยก Yard  |  PDI Monthly Summary by Yard');
    xbanner(ws,2,ncol,RANGE_TH,12,XL.BAND,20);
    xpaint(ws,4,1,5,1,{fill:XP(XL.HDR),border:BOXK,font:XF(10,true,XL.NAVY),align:XCENW});
    xset(ws,4,1,'เดือน / Month'); ws.mergeCells(4,1,5,1);
    const groups=YARDS.map(y=>[y,y]).concat([['รวมทุก Yard',null]]);
    let cc=2; const gcol={};
    groups.forEach(([label,yard])=>{
      xpaint(ws,4,cc,4,cc+2,{fill:XP(yard?XL.LAV:XL.PEACH),border:BOXK,font:XF(10,true,XL.BLACK),align:XCEN});
      xset(ws,4,cc,label); ws.mergeCells(4,cc,4,cc+2);
      [['Plan',XL.T_BLUE,XL.NAVY],['Actual',XL.T_GREEN,XL.NAVY],['Diff.',XL.T_YELL,XL.RED]].forEach(([t,bg,fg],k)=>
        xset(ws,5,cc+k,t,{font:XF(9,true,fg),fill:XP(bg),align:XCEN,border:BOXK}));
      gcol[label]=cc; cc+=3;
    });
    const PCT_COL=cc;
    xpaint(ws,4,PCT_COL,5,PCT_COL,{fill:XP(XL.HDR),border:BOXK,font:XF(9,true,XL.NAVY),align:XCENW});
    xset(ws,4,PCT_COL,'%\nสำเร็จ'); ws.mergeCells(4,PCT_COL,5,PCT_COL);
    const tot=gcol['รวมทุก Yard'];
    MONTHS.forEach((mnum,pos)=>{
      const r=6+pos;
      xset(ws,r,1,`${TH_MONTH[mnum-1]} / ${EN_MONTH[mnum-1]}`,{font:XF(10,true,XL.NAVY),fill:XP(XL.WHITE),align:XLEFT,border:BOXK});
      groups.forEach(([label,yard])=>{
        const c0=gcol[label];
        const vals = yard ? [0,1,2].map(k=>`=${SHX(yard)}!$${TOTL}$${GT[`${yard}|${mnum}`][k]}`)
                          : [0,1,2].map(k=>'='+YARDS.map(y=>`${colL(gcol[y]+k)}${r}`).join('+'));
        vals.forEach((v,k)=>xset(ws,r,c0+k,v,{font:XF(9,true,[XL.BLACK,XL.NAVY,XL.RED][k]),fill:XP([XL.T_BLUE,XL.T_GREEN,XL.T_YELL][k]),align:XCEN,fmt:XL.FMT,border:BOXK}));
      });
      xset(ws,r,PCT_COL,`=IF(${colL(tot)}${r}=0,"",${colL(tot+1)}${r}/${colL(tot)}${r})`,{font:XF(9,true,XL.GREY),fill:XP(XL.WHITE),align:XCEN,fmt:XL.PCT,border:BOXK});
    });
    const tr=6+MONTHS.length;
    xset(ws,tr,1,`รวม ${RANGE_EN} / Total`,{font:XF(10,true,XL.WHITE),fill:XP(XL.NAVY),align:XLEFT,border:BOXT});
    for(let c0=2;c0<PCT_COL;c0++) xset(ws,tr,c0,`=SUM(${colL(c0)}6:${colL(c0)}${tr-1})`,{font:XF(9,true,XL.WHITE),fill:XP(XL.NAVY),align:XCEN,fmt:XL.FMT,border:BOXT});
    xset(ws,tr,PCT_COL,`=IF(${colL(tot)}${tr}=0,"",${colL(tot+1)}${tr}/${colL(tot)}${tr})`,{font:XF(9,true,XL.WHITE),fill:XP(XL.NAVY),align:XCEN,fmt:XL.PCT,border:BOXT});
    xset(ws,tr+2,1,'ดึงจากแถว Grand total ของชีต กรอก- ทุกใบอัตโนมัติ — ไม่ต้องกรอกในหน้านี้',{font:XF(8,false,XL.GREY,true)});
  }

  /* ---------- 3. daily summary (all yards) ---------- */
  {
    const ws=wb.getWorksheet('สรุปรายวัน'); ws.views=[{state:'frozen',xSplit:1,ySplit:3,zoomScale:85,showGridLines:false}];
    ws.getColumn(1).width=22; for(let i=2;i<=32;i++) ws.getColumn(i).width=5.6; ws.getColumn(33).width=11;
    xbanner(ws,1,33,'สรุป PDI รายวัน รวมทุก Yard  |  PDI Daily Summary - All Yards');
    xbanner(ws,2,33,RANGE_TH,12,XL.BAND,20);
    let r=4;
    for(const mnum of MONTHS){
      const mi=mnum-1, ndays=daysIn(mnum);
      xbanner(ws,r,33,`${TH_MONTH[mi]} ${YEAR+543}  /  ${EN_MONTH[mi]}-${String(YEAR).slice(2)}`,11,XL.BAND,18,XLEFT);
      const hr=r+1;
      xset(ws,hr,1,'วันที่ / Day',{font:XF(10,true,XL.NAVY),fill:XP(XL.HDR),align:XCEN,border:BOXK});
      for(let day=1;day<=31;day++) xset(ws,hr,1+day, day<=ndays?day:null,{font:XF(9,true,XL.NAVY),fill:XP(day<=ndays?XL.HDR:XL.NA),align:XCEN,border:BOXK});
      xset(ws,hr,33,'รวมทั้งเดือน',{font:XF(9,true,XL.WHITE),fill:XP(XL.NAVY),align:XCENW,border:BOXK});
      ws.getRow(hr).height=22;
      [['Plan PDI',0,XL.BLACK,XL.T_BLUE],['Actual PDI',1,XL.NAVY,XL.T_GREEN],['Diff.',2,XL.RED,XL.T_YELL]].forEach(([label,idx,fg,bg],k)=>{
        const rr=hr+1+k;
        xset(ws,rr,1,label,{font:XF(10,true,fg),fill:XP(bg),align:XLEFT,border:BOXK});
        for(let day=1;day<=31;day++){
          const v = day<=ndays ? '='+YARDS.map(y=>`${SHX(y)}!${colL(ECOL0+day-1)}${GT[`${y}|${mnum}`][idx]}`).join('+') : null;
          xset(ws,rr,1+day,v,{fill:XP(day<=ndays?bg:XL.NA),font:XF(9,true,fg),align:XCEN,fmt:XL.FMT,border:BOXK});
        }
        xset(ws,rr,33,'='+YARDS.map(y=>`${SHX(y)}!$${TOTL}$${GT[`${y}|${mnum}`][idx]}`).join('+'),{font:XF(10,true,XL.WHITE),fill:XP(XL.NAVY),align:XCEN,fmt:XL.FMT,border:BOXK});
      });
      const pr=hr+4;
      xset(ws,pr,1,'% ความสำเร็จ',{font:XF(10,true,XL.NAVY),fill:XP(XL.HDR),align:XLEFT,border:BOXK});
      for(let day=1;day<=32;day++){
        const colx = day===32?33:1+day, live = day===32||day<=ndays, L=colL(colx);
        xset(ws,pr,colx, live?`=IF(N(${L}${hr+1})=0,"",${L}${hr+2}/${L}${hr+1})`:null,
          {fill:XP(day===32?XL.NAVY:(live?XL.WHITE:XL.NA)), font:XF(day===32?10:9,true,day===32?XL.WHITE:XL.GREY), align:XCEN, fmt:XL.PCT, border:BOXK});
      }
      r=pr+2;
    }
    ws.mergeCells(r,1,r,33);
    xset(ws,r,1,'รวมแถว Grand total ของชีต กรอก- ทุกใบอัตโนมัติ — ไม่ต้องกรอกในหน้านี้  ·  ช่องเทา = วันที่ไม่มีจริงในเดือนนั้น',{font:XF(8,false,XL.GREY,true)});
  }

  /* ---------- 4. Report ---------- */
  {
    const ws=wb.getWorksheet('Report'); ws.views=[{state:'frozen',xSplit:0,ySplit:6,showGridLines:false}];
    [[1,26.9],[2,15],[3,15],[4,14],[5,16],[6,26]].forEach(([c,w])=>ws.getColumn(c).width=w);
    xbanner(ws,1,6,'สรุป PDI รายเดือน รวมทุก Yard  |  PDI Monthly Summary - All Yards');
    ws.mergeCells(3,1,3,6);
    xset(ws,3,1,`ข้อมูลนำเข้าจาก Defect list Co-inspection ถึง ${cutoff} (Plan = Match Tax/Shuttle, Actual = PDI, ตัด Move from = MAIN YARD) · กรอกต่อที่ชีต กรอก- ของแต่ละ Yard · รวม ${YARDS.length} Yard: ${YARDS.join(', ')}`,
      {font:XF(9,false,XL.NAVY),fill:XP(XL.HDR),align:XLEFTW});
    xpaint(ws,3,1,3,6,{border:BOX}); ws.getRow(3).height=28;
    xbanner(ws,5,6,RANGE_TH,12,XL.BAND,20);
    const header=(row,first)=>[[1,first,XL.HDR,XL.NAVY],[2,'Plan PDI',XL.PLAN_H,XL.WHITE],[3,'Actual PDI',XL.ACT_H,XL.WHITE],[4,'Diff.',XL.HDR,XL.NAVY],[5,'% ความสำเร็จ',XL.HDR,XL.NAVY],[6,'หมายเหตุ / Remark',XL.HDR,XL.NAVY]]
      .forEach(([c0,t,bg,fg])=>xset(ws,row,c0,t,{font:XF(10,true,fg),fill:XP(bg),align:XCEN,border:BOXH}));
    const rowf=(row,label,pf,af)=>{
      xset(ws,row,1,label,{font:XF(10,true,XL.NAVY),fill:XP(XL.WHITE),align:XLEFT,border:BOX});
      xset(ws,row,2,pf,{font:XF(10,true,XL.PLAN_T),fill:XP(XL.PLAN_C),align:XCEN,fmt:XL.FMT,border:BOX});
      xset(ws,row,3,af,{font:XF(10,true,XL.ACT_T),fill:XP(XL.ACT_C),align:XCEN,fmt:XL.FMT,border:BOX});
      xset(ws,row,4,`=C${row}-B${row}`,{font:XF(10,true,XL.DKRED),fill:XP(XL.WHITE),align:XCEN,fmt:XL.FMT,border:BOX});
      xset(ws,row,5,`=IF(B${row}=0,"",C${row}/B${row})`,{font:XF(10,true,XL.GREY),fill:XP(XL.WHITE),align:XCEN,fmt:XL.PCT,border:BOX});
      xpaint(ws,row,6,row,6,{font:XF(9,false,XL.BLUE_IN),fill:XP(XL.INPUT),align:XLEFT,border:BOX});
    };
    const totf=(row,label,r1,r2)=>{
      xset(ws,row,1,label,{font:XF(10,true,XL.WHITE),fill:XP(XL.NAVY),align:XLEFT,border:BOXT});
      [[2,`=SUM(B${r1}:B${r2})`,XL.FMT],[3,`=SUM(C${r1}:C${r2})`,XL.FMT],[4,`=C${row}-B${row}`,XL.FMT],[5,`=IF(B${row}=0,"",C${row}/B${row})`,XL.PCT]]
        .forEach(([c0,v,fmt])=>xset(ws,row,c0,v,{font:XF(10,true,XL.WHITE),fill:XP(XL.NAVY),align:XCEN,fmt,border:BOXT}));
      xpaint(ws,row,6,row,6,{fill:XP(XL.NAVY),border:BOXT});
    };
    header(6,'เดือน / Month');
    MONTHS.forEach((mnum,pos)=>rowf(7+pos,EN_MONTH[mnum-1],
      '='+YARDS.map(y=>`${SHX(y)}!$${TOTL}$${GT[`${y}|${mnum}`][0]}`).join('+'),
      '='+YARDS.map(y=>`${SHX(y)}!$${TOTL}$${GT[`${y}|${mnum}`][1]}`).join('+')));
    const cutM = (()=>{ const p=cutoff.split('/'); return p.length===3 ? Number(p[1]) : null; })();
    if(cutM && MONTHS.includes(cutM)) xset(ws,7+MONTHS.indexOf(cutM),6,`Cut off ${cutoff}`);
    const TOTR=7+MONTHS.length;
    totf(TOTR,`รวม ${RANGE_EN} / Total`,7,TOTR-1);
    const YHDR=TOTR+2;
    xbanner(ws,YHDR,6,`แยกราย Yard (${RANGE_EN} ${YEAR})  /  By Yard`,12,XL.BAND,20);
    header(YHDR+1,'Yard');
    YARDS.forEach((y,yi)=>rowf(YHDR+2+yi,y,
      '='+MONTHS.map(m=>`${SHX(y)}!$${TOTL}$${GT[`${y}|${m}`][0]}`).join('+'),
      '='+MONTHS.map(m=>`${SHX(y)}!$${TOTL}$${GT[`${y}|${m}`][1]}`).join('+')));
    const YTOT=YHDR+2+YARDS.length;
    totf(YTOT,'รวมทุก Yard / Total',YHDR+2,YTOT-1);
    xset(ws,YTOT+2,1,'สายข้อมูล:  กรอก-<Yard>  →  หน้านี้ + สรุปรายเดือน-แยก Yard + สรุปรายวัน   ·   กรอกที่ชีต กรอก- ที่เดียว',{font:XF(8,false,XL.GREY,true)});
  }

  wb.views=[{firstSheet:0, activeTab:0, visibility:'visible'}];

  const buf = await wb.xlsx.writeBuffer();
  const [dd,mm,yy]=(cutoff||'').split('/');
  const stamp = (dd&&mm&&yy) ? `${dd}_${mm}_${yy}` : new Date().toISOString().slice(0,10).replace(/-/g,'_');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=`PDI_Plan-Actual_All Yard Update ${stamp}.xlsx`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('ดาวน์โหลดไฟล์ Excel แล้ว');
}

/* ---------- boot ---------- */
$('#tabs').onclick = e=>{
  const b=e.target.closest('button[data-v]'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x===b));
  state.view=b.dataset.v; render();
};
$('#xlsBtn').onclick = ()=>exportExcel().catch(e=>{ console.error(e); alert('สร้างไฟล์ไม่สำเร็จ: '+e.message); });
$('#themeBtn').onclick = ()=>{
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  try{ localStorage.setItem('pdi_theme',cur); }catch(e){}
};
try{ const t=localStorage.getItem('pdi_theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

const today=new Date();
if(today.getFullYear()===YEAR && SEED.months.includes(today.getMonth()+1)) state.month=today.getMonth()+1;

initDB().then(()=>{ state.ready=true; render(); });
</script>
</body>
</html>
